name: Release builds

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: '1.98.1'
          command: check licenses
          arguments: --locked --all-features
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - name: Test the Apache sum_tree patch
        run: cargo test --locked --manifest-path vendor/sum_tree/Cargo.toml

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check-release-version.py
      - run: python scripts/test-release-maintenance.py
      - run: python scripts/test-registry-artifacts.py
      - run: python scripts/test-desktop-channels.py
      - run: python scripts/test-macos-installer.py
      - run: python scripts/test-benchmark-tools.py
      - name: Require retained compatibility fixtures for this release
        run: python scripts/check-compatibility-fixtures.py
      - run: cargo test --locked -p rexafs
      - run: cargo test --locked -p rexafs --features ndarray-compat
      - run: cargo test --locked -p rexafs --features trust-region
      - run: cargo package --locked -p rexafs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-package
          path: target/package/rexafs-*.crate
          if-no-files-found: error

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --locked --manifest-path py-rexafs/Cargo.toml --out dist --interpreter python${{ matrix.python }}
          manylinux: auto
          rust-toolchain: '1.98.1'
      - run: python -m pip install --no-index --find-links dist rexafs --no-deps
      - run: python -m pip install numpy
      - run: python py-rexafs/tests/test_api.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install maturin twine
      - run: maturin sdist --manifest-path py-rexafs/Cargo.toml --out dist
      - run: python scripts/check-python-sdist.py dist/*.tar.gz
      - run: twine check dist/*
      - run: python -m pip install dist/*.tar.gz
      - run: python py-rexafs/tests/test_api.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: cargo install wasm-pack --locked --version 0.15.0
      - run: npm --prefix js-rexafs run build
      - run: npm --prefix js-rexafs test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python js-rexafs/test/browser.py
      - run: npm pack
        working-directory: js-rexafs
      - run: node scripts/test-npm-package.mjs js-rexafs/rexafs-*.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: js-rexafs/rexafs-*.tgz
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            features: refeff-runner,feff10-runner
          - os: macos-15-intel
            features: refeff-runner,feff10-runner
          - os: ubuntu-24.04
            features: refeff-runner,feff10-runner
          # The Windows build uses MSVC; the FEFF10 prebuilt
          # currently targets MinGW and is not compatible with that toolchain.
          - os: windows-2025
            features: refeff-runner
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux platform dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libfontconfig-dev libglib2.0-dev libgtk-3-dev libssl-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev libsqlite3-dev
      - name: Project compatibility, publication and desktop regressions
        run: cargo test --locked --release -p rexafs-gui --no-default-features --features ${{ matrix.features }}
      - name: Embedded FEFF runner and fitting integration
        if: runner.os != 'Windows'
        run: cargo test --locked --release -p rexafs --features refeff-runner,feff10-runner --test refeff_runner --test feff10_s02k_parity
      - name: Archive regression checks
        run: python scripts/test-release-archive.py
      - run: cargo build --locked --release -p rexafs-gui --no-default-features --features ${{ matrix.features }}
      - run: python scripts/package-desktop.py
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: runner.os == 'Windows'
        with:
          version: '0.12.3'
          python-version: '3.12'
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          uv run --no-project python scripts/test-windows-installer.py
          uv run --no-project python scripts/windows_installer.py target/distributions --bundle "target/distributions/rexafs-*-pc-windows-msvc"
      - name: Install, reinstall and uninstall Windows package
        if: runner.os == 'Windows'
        run: ./scripts/test-windows-installer.ps1 -Directory target/distributions
      - name: Build and smoke-test unsigned Mac installer preview
        if: runner.os == 'macOS'
        run: |
          python -m pip install -r scripts/macos-installer-requirements.txt
          python scripts/preview-macos-installer.py target/distributions/rexafs-*-apple-darwin installer-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        with:
          name: installer-preview-${{ matrix.os }}
          path: installer-preview/*-preview.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/distributions/*.zip
            target/distributions/*.tar.gz
            target/distributions/*.sha256
            target/distributions/*-setup.exe
            target/distributions/*-setup.build.json
            target/distributions/*-setup.exe.qualification.json
          if-no-files-found: error

  manifest:
    needs: [licenses, core, python, sdist, npm, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Hash every qualified distribution
        run: python scripts/check-artifacts.py create artifacts SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: SHA256SUMS
          if-no-files-found: error
