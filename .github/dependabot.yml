version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Published levenberg-marquardt 0.15 exposes nalgebra 0.34 types.
      # Revisit this exclusion when a compatible solver release is published.
      - dependency-name: nalgebra
        versions: [">=0.35, <0.36"]
  - package-ecosystem: npm
    directory: /js-rexafs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
