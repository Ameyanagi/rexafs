name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'py-rexafs/python/rexafs/*.pyi'
      - 'py-rexafs/src/lib.rs'
      - 'js-rexafs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/rexafs/src/**'
      - 'crates/rexafs/Cargo.toml'
      - 'crates/rexafs-wasm/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'py-rexafs/python/rexafs/*.pyi'
      - 'py-rexafs/src/lib.rs'
      - 'js-rexafs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/rexafs/src/**'
      - 'crates/rexafs/Cargo.toml'
      - 'crates/rexafs-wasm/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://ameyanagi.github.io' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/rexafs' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - name: Install the browser engine build tool
        run: cargo install wasm-pack --locked --version 0.15.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            website/.cache/rustdoc
          key: website-rustdoc-${{ runner.os }}-1.98.1-${{ hashFiles('website/src/data/release.json', 'website/scripts/rustdoc-header.html') }}
      - name: Install website dependencies
        run: npm --prefix website ci
      - name: Verify documentation inheritance and release boundaries
        run: npm --prefix website run test:generators
      - name: Regenerate API pages and citations
        run: |
          python website/scripts/generate-python-reference.py
          node website/scripts/generate-typescript-reference.mjs
          node website/scripts/generate-citations.mjs
          git diff --exit-code -- website/src/content/docs/docs/reference website/src/data/api-citations.json
          test -z "$(git ls-files --others --exclude-standard website/src/content/docs/docs/reference)"
      - name: Build Stable and Next Rust APIs
        env:
          DOCS_CARGO_TARGET_DIR: ${{ github.workspace }}/website/.cache/rustdoc
        run: node website/scripts/build-rust-reference.mjs
      - name: Check, build and verify public content
        run: |
          npm --prefix website run check
          npm --prefix website run build
          npm --prefix website test
      - name: Check browser behavior and accessibility
        working-directory: website
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
