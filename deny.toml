# Check the whole workspace on every platform, including optional integrations.
# Leaving targets unset includes all target-specific dependency branches.
[graph]
all-features = true

[licenses]
include-dev = true
include-build = true
confidence-threshold = 0.95
unused-allowed-license = "allow"
# Existing non-GPL license choices. SPDX OR alternatives are satisfied by an
# allowed choice; no GPL, AGPL or LGPL license is accepted by this policy.
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "NCSA",
    "CC0-1.0", "CDLA-Permissive-2.0", "Unicode-3.0", "Zlib", "bzip2-1.0.6",
    "MPL-2.0", "CDDL-1.0",
]

# RustSec advisories (https://rustsec.org). Known vulnerabilities fail the check.
# Unmaintained crates fail only when the workspace depends on them directly;
# transitive ones (mostly through gpui) are reported by `cargo deny` locally.
# Every ignore names the dependency path and why the issue is not reachable;
# remove the entry as soon as an upstream release carries the fix.
[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # quick-xml 0.36 (duplicate-attribute quadratic time; NsReader namespace
    # allocation) via ruviz -> typst 0.13 -> hayagriva -> citationberg, which
    # parses CSL bibliography styles. ruviz compiles plot labels only and never
    # loads bibliographies. Fixed in quick-xml 0.41; needs a ruviz typst upgrade.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via typst bibliography parsing; not reachable from ruviz plot labels" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via typst bibliography parsing; not reachable from ruviz plot labels" },
    # quick-xml 0.26 also enters through pprof 0.15 -> inferno 0.11, a
    # dev-dependency for benchmark flamegraphs that writes, not parses, XML.
    # ruzstd 0.8 (decompression bomb) via xraydb 0.4.1, which decompresses only
    # the X-ray database embedded in the crate. Fixed in ruzstd 0.9.1; needs an
    # xraydb release.
    { id = "RUSTSEC-2026-0344", reason = "ruzstd via xraydb decompresses only its own embedded, trusted database" },
    # zstd 0.11/0.13 and zstd-safe 5/7 (stream-context reuse leak; legacy-frame
    # and seekable decompression memory errors) via apex-solver 1.4 -> apex-io,
    # which reads pose-graph and MCAP files. rexafs uses apex-solver only for
    # in-memory trust-region fits and never calls apex-io. Fixed in zstd 0.14.3
    # and zstd-safe 8.2; needs an apex-io release.
    { id = "RUSTSEC-2026-0391", reason = "zstd via apex-io file readers; rexafs never calls apex-io" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe via apex-io file readers; rexafs never calls apex-io" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe via apex-io file readers; rexafs never calls apex-io" },
]
