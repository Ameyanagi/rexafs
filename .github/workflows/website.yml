name: Website

on:
  push:
    branches: [main, dev]
    paths:
      - 'website/**'
      - 'py-rexafs/python/rexafs/*.pyi'
      - 'py-rexafs/src/lib.rs'
      - 'py-rexafs/Cargo.toml'
      - 'pyproject.toml'
      - 'js-rexafs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/rexafs/src/**'
      - 'crates/rexafs/Cargo.toml'
      - 'crates/rexafs-gui/Cargo.toml'
      - 'crates/rexafs-wasm/**'
      - 'scripts/check-release-version.py'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'py-rexafs/python/rexafs/*.pyi'
      - 'py-rexafs/src/lib.rs'
      - 'py-rexafs/Cargo.toml'
      - 'pyproject.toml'
      - 'js-rexafs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/rexafs/src/**'
      - 'crates/rexafs/Cargo.toml'
      - 'crates/rexafs-gui/Cargo.toml'
      - 'crates/rexafs-wasm/**'
      - 'scripts/check-release-version.py'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://ameyanagi.github.io' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/rexafs' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # Always the newest 24.x: the runner's cached Node can lag behind
          # security releases (CVE-2026-111497 is fixed in 24.22.1).
          check-latest: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # 1.4.4 carries the CVE-2026-111497 Brotli fix.
          bun-version: 1.4.4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check browser engine version against the Rust workspace
        run: python scripts/check-release-version.py
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - name: Restore the pinned browser engine build tool
        id: wasm-pack-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache only the tool, never generated modules or release artifacts.
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-0.15.0
      - name: Install the browser engine build tool
        if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --locked --version 0.15.0
      - name: Verify the browser engine build tool version
        run: test "$(wasm-pack --version)" = "wasm-pack 0.15.0"
      - name: Restore Rust and WASM compilation dependencies
        id: rust-dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            website/.cache/rustdoc
            !website/.cache/rustdoc/doc
            website/.cache/wasm
          key: website-rust-deps-v2-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config*') }}
          restore-keys: |
            website-rust-deps-v2-${{ runner.os }}-${{ runner.arch }}-1.98.1-
      - name: Identify Rust reference inputs
        id: rustdoc-keys
        run: node website/scripts/build-rust-reference.mjs --cache-keys
      - name: Restore published Stable Rust reference
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/.cache/rustdoc-html/stable
          key: website-rustdoc-stable-v1-${{ steps.rustdoc-keys.outputs.stable }}
      - name: Restore source-checkout Next Rust reference
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/.cache/rustdoc-html/next
          key: website-rustdoc-next-v1-${{ steps.rustdoc-keys.outputs.next }}
      - name: Install website dependencies
        run: bun install --cwd website --frozen-lockfile
      - name: Verify documentation inheritance and release boundaries
        run: bun run --cwd website test:generators
      - name: Regenerate API pages and citations
        run: |
          python website/scripts/generate-python-reference.py
          node website/scripts/generate-typescript-reference.mjs
          node website/scripts/generate-citations.mjs
          git diff --exit-code -- website/src/content/docs/docs/reference website/src/data/api-citations.json
          test -z "$(git ls-files --others --exclude-standard website/src/content/docs/docs/reference)"
      - name: Build Stable and Next Rust APIs
        env:
          DOCS_CARGO_TARGET_DIR: ${{ github.workspace }}/website/.cache/rustdoc
        run: node website/scripts/build-rust-reference.mjs
      - name: Check, build and verify public content
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/website/.cache/wasm
        run: |
          # Reuse dependency compilation while rebuilding our browser engine.
          cargo clean --locked --release --target wasm32-unknown-unknown -p rexafs -p rexafs-wasm
          bun run --cwd website check
          bun run --cwd website build
          bun run --cwd website test
      - name: Check browser behavior and accessibility
        working-directory: website
        run: |
          bunx playwright install --with-deps chromium
          bun run test:browser
      - name: Save shared compilation dependencies from main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.rust-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            website/.cache/rustdoc
            !website/.cache/rustdoc/doc
            website/.cache/wasm
          key: ${{ steps.rust-dependencies.outputs.cache-primary-key }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
