name: Publish reviewed release

# Run on the release tag, or on a reviewed tooling tag with release_tag supplied.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Distribution to publish (allows resuming a partial release)
        type: choice
        options: [crates-io, pypi, npm, github-draft]
        required: true
      build_run_id:
        description: Successful Release builds run ID for this exact tag commit
        type: string
        required: true
      release_tag:
        description: Existing reviewed source tag (leave empty when running on that tag)
        type: string
        required: false
      registry_auth:
        description: Use token only for the first crates.io/npm upload; PyPI always uses trusted publishing
        type: choice
        options: [trusted-publishing, token]
        default: trusted-publishing
        required: true

permissions:
  contents: read
  actions: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      python_abi: ${{ steps.source.outputs.python_abi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require the reviewed source tag and its successful manual build
        id: source
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          test "$RELEASE_REF_TYPE" = tag
          python scripts/check-release-source.py "$RELEASE_TAG" "$BUILD_RUN_ID"

  publish:
    needs: version
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.channel == 'github-draft'
        with:
          path: artifacts
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.channel != 'github-draft'
        with:
          name: release-manifest
          path: artifacts/release-manifest
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.channel == 'crates-io'
        with:
          name: rust-package
          path: artifacts/rust-package
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.channel == 'npm'
        with:
          name: npm-package
          path: artifacts/npm-package
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.channel == 'pypi'
        with:
          pattern: wheel-*
          path: artifacts
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.channel == 'pypi'
        with:
          name: python-sdist
          path: artifacts/python-sdist
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify GitHub artifact checksums
        if: inputs.channel == 'github-draft'
        run: python scripts/check-artifacts.py verify artifacts artifacts/release-manifest/SHA256SUMS
      - name: Stage desktop downloads for GitHub
        if: inputs.channel == 'github-draft'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release_downloads.py artifacts artifacts/release-manifest/SHA256SUMS github-dist "$RELEASE_VERSION"
      - name: Require every registry package and its original build checksum
        if: inputs.channel != 'github-draft'
        env:
          PUBLISH_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PYTHON_ABI: ${{ needs.version.outputs.python_abi }}
        run: python scripts/check-registry-artifacts.py "$PUBLISH_CHANNEL" artifacts artifacts/release-manifest/SHA256SUMS "$RELEASE_VERSION" --python-abi "$PYTHON_ABI"
      - name: Check out the exact qualified Rust source
        if: inputs.channel == 'crates-io'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.commit }}
          path: release-source
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: inputs.channel == 'crates-io'
        with:
          toolchain: 1.98.1
      - name: Verify Rust package matches the GitHub artifact
        if: inputs.channel == 'crates-io'
        working-directory: release-source
        run: |
          cargo package --locked -p rexafs
          cmp target/package/rexafs-*.crate ../artifacts/rust-package/rexafs-*.crate
      - name: Authenticate to crates.io with trusted publishing
        if: inputs.channel == 'crates-io' && inputs.registry_auth == 'trusted-publishing'
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Publish Rust library
        if: inputs.channel == 'crates-io'
        working-directory: release-source
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.registry_auth == 'token' && secrets.CRATES_IO_TOKEN || steps.crates_auth.outputs.token }}
        run: |
          : "${CARGO_REGISTRY_TOKEN:?Configure CRATES_IO_TOKEN for the first upload, or configure the crates.io trusted publisher}"
          cargo publish --locked -p rexafs
      - name: Collect Python distributions
        if: inputs.channel == 'pypi'
        run: |
          mkdir python-dist
          find artifacts/wheel-* artifacts/python-sdist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} python-dist/ \;
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        if: inputs.channel == 'pypi'
        with:
          packages-dir: python-dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.channel == 'npm'
        with:
          node-version: '24'
          # Always the newest 24.x: the runner's cached Node can lag behind
          # security releases (CVE-2026-111497 is fixed in 24.22.1).
          check-latest: true
          registry-url: https://registry.npmjs.org
          # Release job: never restore a dependency cache another workflow wrote.
          package-manager-cache: false
      - name: Publish npm package
        if: inputs.channel == 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ inputs.registry_auth == 'token' && secrets.NPM_TOKEN || '' }}
          REGISTRY_AUTH: ${{ inputs.registry_auth }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [[ "$REGISTRY_AUTH" == token ]]; then
            : "${NODE_AUTH_TOKEN:?Configure NPM_TOKEN in the release environment for the first upload}"
          fi
          npm install --global npm@11
          DIST_TAG=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then DIST_TAG=next; fi
          npm publish artifacts/npm-package/*.tgz --access public --tag "$DIST_TAG"
      - name: Create GitHub draft with reviewed artifacts
        if: inputs.channel == 'github-draft'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          PRERELEASE=()
          if [[ "$RELEASE_TAG" == *-* ]]; then PRERELEASE=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "rexafs $RELEASE_TAG" "${PRERELEASE[@]}"
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" github-dist/* --clobber
